name: "7.Run_Job_If_Job_Success"

on:
  push:
    branches: [ "main" ]

jobs:
  checkout:
     runs-on: ubuntu-latest
     steps:
       - name: Checkout
         uses: actions/checkout@v4
  test_cases:
      runs-on: ubuntu-latest
      needs: checkout
      steps:
        - name: Test_Cases
          run: echo "Running Test Cases"
  deploy:
     runs-on: ubuntu-latest
     needs: test_cases
     if: success()
     steps:
        - name: Deploy
          run: echo "Deployment done"
