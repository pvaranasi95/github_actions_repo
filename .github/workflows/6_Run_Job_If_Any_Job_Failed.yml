name: "Run_Job_If_Any_Job_Failed"

on:
  push:
    branches: [ "main" ]

jobs:
  checkout:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v4

  disk_usage:
      runs-on: ubuntu-latest
      needs: checkout
      steps:
        - name: Disk_Usage
          run: df -h
  dateandtime:
     runs-on: ubuntu-latest
     needs: disk_usage
     if: failure()
     steps:
       - name: Date&Time
         run: date
