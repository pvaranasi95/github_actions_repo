name: "13.Conditional_Deployment"

on:
  workflow_dispatch:

jobs:
    Pre_Deployment_Check:
       runs-on: ubuntu-latest
       steps:
          - name: Pre_Deployment_Check
            id: check
            run: |
                df -h
                if [ $? -eq 0 ]; then
                echo "check_status=PASSED" >> "$GITHUB_OUTPUT"
                else
                echo "check_status=NOT_PASSED" >> "$GITHUB_OUTPUT"
                fi
       outputs:
              check_status: ${{ steps.check.outputs.check_status }}

    Deploy:
        runs-on: ubuntu-latest
        needs: Pre_Deployment_Check
        steps:
        - name: Deploy
          if: needs.Pre_Deployment_Check.outputs.check_status == 'PASSED' 
          run: echo "Deployment Started"
    Deployment_Skipped:
        runs-on: ubuntu-latest
        needs: Pre_Deployment_Check
        if: success()
        steps:
          - name: Deployment_Skipped
            if: needs.Pre_Deployment_Check.outputs.check_status == 'NOT_PASSED'
            run: echo "Deployment Skipped"
