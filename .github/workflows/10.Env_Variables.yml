name: "10. Environment Variables"
env:
  APP_NAME: "payment-service"

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT : "staging"
    steps:
      - name: Deploy
        env:
            VERSION : 2.5
        run: echo "Deploying Version $VERSION to $ENVIRONMENT Environment for $APP_NAME Application"