name: "08.Artifact Upload & Download"

on:
  workflow_dispatch:

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
  file_creation:
     runs-on: ubuntu-latest
     steps:
       - name: Create file
         run: mkdir reports && date > reports/file.txt
       - name: Artifacts_Upload
         uses: actions/upload-artifact@v4
         with:
           name: test-artifact
           path: reports/
  artifacts_download:
      runs-on: ubuntu-latest
      needs: file_creation
      steps:
        - name: Artifacts_Download
          uses: actions/download-artifact@v4
          with:
            name: test-artifact
            path: reports/
            
  
