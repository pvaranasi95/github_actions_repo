name: "9.Manual_Triggers_with_Inputs"

on:
  workflow_dispatch:
    inputs:
        option:
           description: 'Select your Input'
           required: true
           type: 'choice'
           default: 'disk_check'
           options:
             - disk_check
             - memory_check
             - process_check
                  

jobs:
  Verify_Input:
    runs-on: ubuntu-latest
    steps:
      - name: Check_Input
        run: echo "Selcted input is ${{inputs.option}}
  Disk_Check:
    runs-on: ubuntu-latest
    if: ${{ inputs.option == 'disk_check' }}
    steps:
      - name: Disck_Usage
        run: df -h
  Memory_Check:
     runs-on: ubuntu-latest
     if: ${{ inputs.option == 'memory_check' }}
     steps:
       - name: Memory_Check
         run: free -h
  Process_Check:
     runs-on: ubuntu-latest
     if: ${{ inputs.option == 'process_check' }}
     steps:
       - name: Process_Check
         run: ps -aux
  
