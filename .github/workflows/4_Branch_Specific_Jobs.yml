name: "Branch_Specific_Jobs"

on:
  push:
    branches: [ "main" ]

jobs:
  checkout:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
  date_time:
     runs-on: ubuntu-latest
     steps:
       - name: Date&Time
         run: date
