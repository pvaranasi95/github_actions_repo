
name: "2.Multi Jobs"

on:
  push:
    branches: [ "main" ]

jobs:
  checkout:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v4
  datetime:
      runs-on: ubuntu-latest
      steps:
         - name: Date&Time
           run: date
  disk_usage:
       runs-on: ubuntu-latest
       steps:
          -  name: Disk Usage
             run: df -h
          
