name: "11_GitHub_Secrets"

on:
  workflow_dispatch:

jobs:
  Docker_Login:
         runs-on: ubuntu-latest
         steps:
           - name: Docker_Login
             run: echo ${{ secrets.DOCKER_API_TOKEN }} | docker login --username ${{secrets.DOCKER_USER}} --password-stdin
  Login_Success:
          runs-on: ubuntu-latest
          needs: Docker_Login
          if: success()
          steps:
           - name: Login Status
             run: echo "Docker Login Success"
  Login_Failure:
          runs-on: ubuntu-latest
          needs: Docker_Login
          if: failure()
          steps:
            - name: Login Failure
              run: echo "Docker Login Failed"
             
             
  
