name: "15_Deploying_To_Environments"

on:
  workflow_dispatch:

jobs:
  Build_Check:
      runs-on: ubuntu-latest
      steps:
        - name: Build_Check
          id: build
          run: echo "build_status=Build Validation Successful" >> "$GITHUB_OUTPUT"
      outputs:
          build_status: ${{ steps.build.outputs.build_status }}
  Deploy:
      runs-on: ubuntu-latest
      needs: Build_Check
      if: needs.Build_Check.outputs.build_status == 'Build Validation Successful'
      environment:
        name: DEV
      steps:
         - name: Deploy
           run: echo "Deployment Started"
      
      
  
